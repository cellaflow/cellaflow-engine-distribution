# The engine refuses to start without an auth token. Create the Secret first,
# with a `token` key:
#
#   kubectl create secret generic cellaflow-auth \
#     --from-literal=token="$(openssl rand -hex 32)"
#
# Clients send it as `authorization: Bearer <token>` or `x-api-key: <token>`.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cellaflow-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cellaflow
  labels:
    app: cellaflow
spec:
  replicas: 1
  strategy:
    type: Recreate # Required: RocksDB requires an exclusive file lock on the volume
  selector:
    matchLabels:
      app: cellaflow
  template:
    metadata:
      labels:
        app: cellaflow
    spec:
      securityContext:
        fsGroup: 10001
      initContainers:
        - name: volume-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 10001:10001 /data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: cellaflow-engine
          # A fixed version: `latest` moves with every release, and with
          # IfNotPresent each node keeps whichever copy it pulled first.
          image: ghcr.io/cellaflow/cellaflow:0.2.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          env:
            - name: CELLAFLOW_HOST
              value: "::"
            - name: CELLAFLOW_DB_PATH
              value: "/data/cellaflow"
            - name: CELLAFLOW_LOG_LEVEL
              value: "info"
            - name: CELLAFLOW_SYNC_WRITES
              value: "true"
            - name: CELLAFLOW_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cellaflow-auth
                  key: token
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: health
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cellaflow-data
---
apiVersion: v1
kind: Service
metadata:
  name: cellaflow
  labels:
    app: cellaflow
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
    - name: health
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app: cellaflow
