{{- if and .Values.auth.token (not .Values.auth.existingSecret) }}
# Only rendered for an inline `auth.token`. With `auth.existingSecret` the Secret
# is yours and this chart does not touch it.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cellaflow-engine.fullname" . }}-auth
  labels:
    {{- include "cellaflow-engine.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.auth.token | quote }}
{{- end }}
