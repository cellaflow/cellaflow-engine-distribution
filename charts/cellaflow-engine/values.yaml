# Note: replicaCount must remain 1. The underlying database (RocksDB)
# requires an exclusive lock on the PVC, so horizontal scaling is not supported.
replicaCount: 1

image:
  repository: ghcr.io/cellaflow/cellaflow
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion, so a chart
  # version installs the engine version it was released with. "latest" moves on
  # every merge to main, and with pullPolicy IfNotPresent a node keeps whichever
  # copy it pulled first, so two pods could run different engines.
  tag: ""

# Authentication. The engine refuses to start unless one of these is set, because
# an unset token makes the gRPC interceptor accept every caller and nothing in the
# process can tell whether it is reachable.
#
# Prefer `existingSecret`. Setting `token` here puts the credential in your values
# file and therefore in whatever stores it.
auth:
  # Name of a Secret with a `token` key.
  existingSecret: ""
  # Inline token. Rendered into a Secret owned by this chart.
  token: ""
  # Serve with no authentication at all. Only for a cluster where something else
  # is doing the authenticating.
  allowUnauthenticated: false

# Lease settings. Empty leaves the engine's own default.
leases:
  # TTL of a lease whose request asks for none (CELLAFLOW_DEFAULT_LEASE_TTL_MS):
  # how long another caller waits to take over a holder that died without
  # asking for a TTL of its own. The engine's default is 20000, or
  # maxLifetimeMs if that is lower. Set, it must be at least 4 and at most
  # maxLifetimeMs, or the engine refuses to start.
  defaultTtlMs: ""
  # Ceiling on a single lease, however often it is renewed
  # (CELLAFLOW_MAX_LEASE_LIFETIME_MS). The engine's default is 3600000. Safe to
  # raise, unsafe to lower: reclaiming a holder that is merely slow lets a
  # second worker repeat a side effect the first may already have performed.
  maxLifetimeMs: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 10001

securityContext:
  runAsNonRoot: true
  runAsUser: 10001

service:
  type: ClusterIP
  port: 50051

ingress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: cellaflow.example.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  cellaflow: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
  otelCollector:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi

nodeSelector: {}

tolerations: []

affinity: {}

telemetry:
  optOut: false # If true, disables mothership telemetry routing
  customerApm:
    endpoint: "" # e.g., "https://otlp.datadoghq.com:4317"
    apiKey: "" # Provide API key directly
    apiKeySecretRef: "" # Provide an existing Kubernetes Secret name

otelCollector:
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.100.0"
    pullPolicy: IfNotPresent
